# Deploy backend lên VPS khi push main
name: Deploy Backend

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then DEPLOY_PATH="/root/ielts-app"; fi

            COMPOSE="docker compose -p ielts -f deploy/docker-compose.yml --env-file deploy/.env"
            BRANCH="${{ github.ref_name }}"

            echo "==> Pull backend (branch: $BRANCH)"
            cd "$DEPLOY_PATH/backend"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            echo "==> Rebuild backend container"
            cd "$DEPLOY_PATH"
            $COMPOSE build backend
            $COMPOSE up -d --no-deps --remove-orphans backend

            echo "==> Done"
            $COMPOSE ps backend
